# Training hyperparameters. Starting values — tune on TRAIN seeds only,
# never on eval seeds (CONSTRAINTS.md #2). Log every run in docs/experiments/EXPERIMENT_LOG.md.

common:
  gamma: 0.99          # patient: end-of-shift misses are charged at the very end,
                       # so the agent must value distant consequences.
  n_episodes: 20000
  eval_every: 500
  log_smoothing_window: 100

epsilon:
  start: 1.0
  min: 0.05            # floor stays above zero: queue composition shifts during a shift,
                       # so a fully greedy agent stops adapting.
  decay: 0.9995        # per episode

dp:                              # Phase 1 — model-based DP on an estimated model (D-004)
  n_estimation_episodes: 50000   # random-policy rollouts for counting P-hat / R-hat
  estimation_seed_start: 10000   # seeds 10000..59999 — disjoint from train/eval/calibration blocks
  value_iteration_theta: 1.0e-4  # convergence threshold on max value change (ROADMAP exit)
  policy_eval_theta: 1.0e-4      # same threshold for policy-iteration's evaluation step
  max_sweeps: 5000               # hard stop so a non-converging run fails loudly, not forever

monte_carlo:
  alpha: 0.05
  first_visit: true              # every-visit MC is not implemented; the loader rejects false
  train_seed_start: 600000       # own block (D-016) — see q_learning.train_seed_start

sarsa:
  alpha: 0.10
  train_seed_start: 400000       # own block (D-016)

q_learning:
  alpha: 0.10
  train_seed_start: 200000        # seeds 200000..200000+n_episodes-1 (D-016).
                                  # Its own block, disjoint from train (1-10),
                                  # eval (101-105), calibration (1000-3099) and
                                  # DP estimation (10000-59999). One fresh shift
                                  # per episode: cycling the 10 train seeds
                                  # 2000x would let the agent memorise ten alert
                                  # streams instead of learning to triage.

dqn:                             # Phase 3 — DQN over the 17-dim continuous state
  hidden_layers: [128, 128]
  activation: relu
  lr: 0.0005
  batch_size: 64
  replay_capacity: 100000        # ~2000 shifts of history at ~50 steps/shift
  learning_starts: 1000          # fill the buffer before training begins
  train_freq: 4                  # one gradient step every 4 env steps (D-024).
                                 # Keeps the 20000-episode budget identical to the
                                 # tabular learners: at 1 step/transition a run is
                                 # 18.3 min (measured), at 4 it is 4.6 min, so the
                                 # DQN-vs-tabular comparison needs no budget caveat.
  target_update_every: 1000      # GRADIENT steps between hard copies, not env steps
  grad_clip_norm: 10.0
  loss: huber
  huber_delta: 200.0             # E-016. NOT torch's default of 1.0, which was the
                                 # Phase 3 collapse: env_default prices burying a real
                                 # incident at -150 and an end-of-shift miss at -200
                                 # (x asset multiplier). At delta 1.0 both sit deep in
                                 # Huber's LINEAR regime, so each produced the same
                                 # gradient as a routine +-1 error -- measured ratio
                                 # 1.014 for a 150x larger error. The agent then never
                                 # learned to fear them and collapsed to BULK_CLOSE
                                 # 99.4% of the time (recall 0.009). 200 is the largest
                                 # NAMED single-event penalty in env_default.yaml, so
                                 # every individual penalty stays quadratic and only the
                                 # compound multi-miss tail (to -1499) is linearised.
  train_seed_start: 1000000      # own block (D-016), disjoint from q_learning 200000,
                                 # sarsa 400000, monte_carlo 600000, ablations 800000
  ablation_seed_start: 1200000   # the Phase 3 ablation sweep gets its own block too
  ablations:                     # Phase 3 required ablations — expect visible instability
    no_replay: false
    no_target_network: false

features:                        # D-032. Shared by EVERY function-approximation
                                 # agent -- the DQN (Phase 3), REINFORCE and
                                 # actor-critic (Phase 4) all consume the same 17
                                 # columns from state.featurise, so scaling them
                                 # differently would make the sample-efficiency
                                 # comparison a comparison of preprocessing.
  scales:                        # D-023. Divisors are domain constants, never tuned.
                               # Measured spread across 888 observations was 470x
                               # (max_age_min reaches 473.6, frac_type_* stay in
                               # [0,1]); unscaled, the age columns dominate every
                               # gradient. Lives here and NOT in env_default.yaml,
                               # which is content-hashed into every EpisodeRecord.
    queue_len: 150.0             # observed ceiling 148; unbounded in principle
    mean_severity: 3.0           # severity.levels runs 0-3
    max_severity: 3.0
    mean_age_min: 480.0          # the shift length — nothing can be older
    max_age_min: 480.0
    mean_asset_criticality: 2.0  # asset_criticality.levels runs 0-2
    max_asset_criticality: 2.0
    mean_verify_cost_min: 30.0   # ceiling of verify_cost_min.options
    frac_type_0: 1.0             # already fractions summing to 1
    frac_type_1: 1.0
    frac_type_2: 1.0
    frac_type_3: 1.0
    frac_type_4: 1.0
    frac_type_5: 1.0
    time_left_norm: 1.0          # already normalised by construction
    alerts_handled: 50.0         # observed ceiling 45
    incidents_confirmed: 10.0    # observed ceiling 6

reinforce:                     # Phase 4 - Monte Carlo policy gradient (S&B 13.3/13.4)
  hidden_layers: [128, 128]    # same shape as the DQN's Q-network on purpose: the
  activation: relu             # sample-efficiency comparison should differ by
                               # algorithm, not by capacity.
  lr: 0.001                    # policy step size. Lower than the DQN's 0.0005 would
                               # be misleading to compare directly - this multiplies
                               # a return of magnitude ~100, not a TD error.
  use_baseline: true           # value baseline for variance reduction; ablate this
  baseline_lr: 0.005           # the value head learns faster than the policy: a
                               # baseline that lags is worse than no baseline,
                               # since it subtracts a stale expectation.
  grad_clip_norm: 10.0         # load-bearing here, not decoration. Returns in this
                               # environment reach +-500, so an unbaselined step is
                               # orders of magnitude larger than the +-1-scale
                               # returns most REINFORCE examples assume.
  train_seed_start: 1400000    # own block (D-016), disjoint from q_learning 200000,
                               # sarsa 400000, monte_carlo 600000, dqn 1000000 and
                               # the dqn ablations 1200000.
  ablation_seed_start: 1600000 # the no-baseline ablation (ROADMAP box 4) trains on
                               # its own block, so the control and the ablated
                               # condition never share alert streams -- the one
                               # confound an ablation must not have (D-027).
  clip_experiment_seed_start: 1800000
                               # E-019. The grad_clip_norm sweep is a TUNING
                               # exercise, so it trains on shifts no reported run
                               # has seen -- a clip value chosen on the control's
                               # own alert streams would launder tuning into the
                               # result it is later quoted beside (D-016,
                               # CONSTRAINTS #2).
                               # NOTE: no epsilon key, deliberately. Policy gradient
                               # explores by sampling its own policy; bolting
                               # epsilon-greedy on would make it a different
                               # algorithm (tests/test_reinforce_config.py).

actor_critic:                  # Phase 4 - one-step actor-critic (S&B 13.5)
  hidden_layers: [128, 128]    # same shape as the DQN and REINFORCE nets. The
  activation: relu             # sample-efficiency comparison is between
                               # ALGORITHMS; differing here would make the plot a
                               # comparison of network size wearing three
                               # algorithm names (the capacity half of D-032).
  actor_lr: 0.001              # matched to reinforce.lr so the two policy-gradient
                               # methods differ by their TARGET, not their step size.
  critic_lr: 0.005             # faster than the actor, for the same reason
                               # reinforce.baseline_lr is: the actor's update is
                               # SCALED by the TD error the critic produces, so an
                               # actor outrunning its critic chases an estimate
                               # that has not caught up.
  entropy_coef: 1.0            # E-020. NOT in S&B 13.5 -- this project's addition, and
                               # 0.0 recovers the textbook algorithm exactly.
                               # 1.0 is MEASURED, not guessed (E-020, 4 values x 3
                               # repeats x 80 episodes on the entropy block). The
                               # sweep bounds it from both sides: at 0.01 and 0.1
                               # the policy COLLAPSES (final entropy 0.0000, one
                               # action in every state) because the bonus, capped
                               # at coef*ln5, cannot compete with TD errors
                               # reaching 1410; at 10.0 entropy pins to 1.571 of a
                               # 1.609 maximum -- 97.6% of uniform -- so the bonus
                               # dominates the TD signal and the policy stops
                               # expressing preferences at all. 1.0 holds entropy
                               # near 0.83: stochastic, but still clearly below
                               # uniform. Chosen on that STRUCTURAL criterion --
                               # the sweep does NOT establish 1.0 as best on
                               # reward and must not be quoted as if it did.
  grad_clip_norm: 10.0         # a DIFFERENT regime from reinforce.grad_clip_norm
                               # despite the identical number: this gradient comes
                               # from ONE step's TD error, not a whole episode's
                               # summed returns, so the pre-clip norms E-019
                               # measured at 600-4000 do not transfer. The trainer
                               # logs the actual norms rather than assuming.
  entropy_experiment_seed_start: 2200000
                               # E-020. Choosing entropy_coef is TUNING, so the
                               # sweep trains on shifts no reported run has seen.
                               # Same reasoning as reinforce.clip_experiment_seed_start.
  train_seed_start: 2000000    # own block (D-016), disjoint from q_learning
                               # 200000, sarsa 400000, monte_carlo 600000,
                               # ablations 800000, dqn 1000000, dqn ablations
                               # 1200000, reinforce 1400000, reinforce ablations
                               # 1600000 and the E-019 clip sweep 1800000.
                               # NOTE: no epsilon key, deliberately -- same
                               # structural point as `reinforce:`.

ppo:                           # optional; first thing to cut if time runs short
  enabled: false
  clip_eps: 0.2
  epochs_per_batch: 4

reward_model:
  hidden_layers: [64, 64]
  lr: 0.001
  epochs: 200
  batch_size: 32
  heldout_fraction: 0.20       # report train AND held-out accuracy separately.
                               # The gap is a reward-hacking audit signal, not a footnote.
  min_heldout_accuracy: 0.65   # below this the model is not informative — say so

rlhf:
  target_pairs: 300
  double_labelled_pairs: 50    # labelled by BOTH annotators, for Cohen's kappa
  pair_must_share_seed: true   # invalid data otherwise — assert it, don't trust it
  # Phase 5a additions (FEATURE_011, session 12).
  pair_seed_start: 3000000     # own block (D-016 convention). NOT the eval block:
                               # the reward model is fitted to human judgements of
                               # these episodes and Phase 5c re-trains on it, so
                               # labelling eval episodes would launder eval-seed
                               # information into the reward a policy maximises.
  n_pair_seeds: 12             # 12 seeds x 36 policy pairings = 432 candidates,
                               # comfortably above target_pairs. Twelve rather
                               # than the 10 train seeds so no labeller sees the
                               # same shift thirty times across 300 pairs.
  pair_sampling_seed: 20260904 # RNG for allocation, side-swap and double-label
                               # choice. Fixed so a rebuild is byte-identical --
                               # labels reference pair_id, so renumbering would
                               # silently repoint every label already collected.
  policies:                    # 9 policies, 36 unordered pairings. oracle_greedy
                               # is excluded on purpose: it reads ground truth, so
                               # its pairs are foregone conclusions and the
                               # Bradley-Terry gradient there is ~0.
    [random, severity_sort, dp, q_learning, sarsa, monte_carlo, dqn, reinforce,
     actor_critic]
  # Phase 5a additions for the labelling page (FEATURE_012, D-040 to D-042).
  labellers: [L1, L2]          # opaque ids per CONSTRAINTS #23 -- the schema in
                               # store.py has nowhere to put a name, and this is
                               # the other half of that rule. The ORDER matters:
                               # it fixes the 125/125 split, so do not reorder it
                               # once labelling has started or every unanswered
                               # pair changes hands.
  max_seconds_per_pair: 300    # over this, seconds_taken is stored as None. A
                               # page left open over lunch would otherwise claim
                               # 1200 seconds of deliberation, which is a
                               # fabricated number rather than a large one.
  ui_host: "127.0.0.1"         # localhost deliberately. 0.0.0.0 is refused by
                               # validation: it would put unlabelled shift data
                               # and a writable database of irreplaceable labels
                               # on the local network for no benefit.
  ui_port: 8000
